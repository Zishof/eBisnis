name: ebisnis_pos
description: >-
  Klien kasir eBisnis.id untuk tablet Android dan Windows. Klien KEDUA dari
  sistem yang sama, bukan POS berdiri sendiri — lihat ADR-012.
publish_to: none
version: 0.1.6

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  excel: ^4.0.6
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^5.0.0

# Sengaja TANPA paket pencetak pihak ketiga.
#
# Perintah ESC/POS dibangun sendiri di `lib/perangkat/escpos.dart` — seluruhnya
# fungsi murni atas daftar byte, sehingga dapat diuji tanpa printer, tanpa
# emulator, dan tanpa perangkat apa pun. Paket pihak ketiga akan menyembunyikan
# byte-nya di balik antarmuka yang hanya dapat dibuktikan dengan mencetak
# sungguhan, dan perintah membuka laci kas adalah hal yang paling tidak nyaman
# untuk dibuktikan dengan cara mencobanya.
#
# Yang tersisa untuk pustaka pihak ketiga hanyalah pengangkutannya (USB, serial,
# Bluetooth), dan itu memang berbeda per platform.

flutter:
  uses-material-design: true
