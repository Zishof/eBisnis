plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

/*
 * Kunci penandatanganan rilis.
 *
 * Dibaca dari `android/key.properties`, yang TIDAK pernah masuk Git — begitu
 * pula berkas keystore-nya. Keduanya ada di .gitignore, dan itu bukan kerapian
 * melainkan syarat: siapa pun yang memegang keystore dapat menerbitkan aplikasi
 * yang dipercaya Android sebagai eBisnis POS di setiap mesin kasir yang sudah
 * memasangnya.
 *
 * Kunci ini PERMANEN. Android menolak memasang pembaruan yang ditandatangani
 * kunci berbeda dari yang terpasang; satu-satunya jalan keluarnya adalah kasir
 * mencopot aplikasinya lebih dahulu — dan mencopot aplikasi kasir berarti
 * menghapus buku transaksi luring yang belum terkirim.
 *
 * Karena itu keystore harus dicadangkan di tempat yang bertahan lebih lama
 * daripada laptop siapa pun.
 */
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "id.ebisnis.ebisnis_pos"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "id.ebisnis.ebisnis_pos"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "produk"
    productFlavors {
        penjualan {
            dimension "produk"
            applicationId = "id.ebisnis.ebisnis_pos"
            resValue "string", "app_name", "eBisnis POS"
        }
        apotik {
            dimension "produk"
            applicationId = "id.emedik.pos_apotik"
            resValue "string", "app_name", "POS Apotik eMedik"
        }
        inventory {
            dimension "produk"
            applicationId = "id.ebisnis.inventory_sales"
            resValue "string", "app_name", "Inventory CMN"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            /*
             * Tanpa key.properties, rilis ditandatangani kunci debug.
             *
             * Itu tetap berjalan di mesin uji, dan sengaja dibiarkan supaya
             * `flutter run --release` bekerja tanpa menyiapkan apa pun. Yang
             * TIDAK boleh terjadi adalah APK berkunci debug ikut terbit ke
             * publik: ia tidak akan pernah dapat diperbarui menjadi APK berkunci
             * rilis. Alur rilis menjaganya — APK hanya dilampirkan ke rilis
             * GitHub bila rahasia penandatanganan ada.
             */
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}
