name: Rilis Inventory Sales

on:
  push:
    tags: ['inventory-v*']
  workflow_dispatch:
    inputs:
      versi:
        description: 'Versi untuk build kandidat (tidak diterbitkan)'
        required: false
        default: '0.0.0-uji'

concurrency:
  group: rilis-inventory-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.27.1'
  JALUR: apps/pos-flutter

jobs:
  uji:
    name: Uji Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Ambil dependensi
        working-directory: ${{ env.JALUR }}
        run: flutter pub get
      - name: Analisis
        working-directory: ${{ env.JALUR }}
        run: flutter analyze
      - name: Uji
        working-directory: ${{ env.JALUR }}
        run: flutter test

  windows:
    name: Bangun installer Windows Inventory
    needs: uji
    runs-on: windows-2022
    timeout-minutes: 35
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Tentukan versi
        id: versi
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            nilai="${GITHUB_REF_NAME#inventory-v}"
          else
            nilai="${{ github.event.inputs.versi }}"
          fi
          echo "nilai=$nilai" >> "$GITHUB_OUTPUT"
      - name: UAT navigasi Windows Inventory
        working-directory: ${{ env.JALUR }}
        shell: pwsh
        run: |
          flutter pub get
          flutter test `
            test/inventory_parity_navigation_test.dart `
            test/inventory_app_test.dart `
            test/inventory_supplier_workspace_test.dart `
            test/inventory_transaction_workspaces_test.dart
      - name: Bangun Windows
        working-directory: ${{ env.JALUR }}
        shell: pwsh
        run: |
          flutter build windows --release --target=lib/main_inventory.dart `
            --dart-define=VERSI=${{ steps.versi.outputs.nilai }} `
            --dart-define=APP_PRODUCT=inventory
      - name: Rakit installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup tidak ditemukan." }
          & $iscc `
            "/DVersi=${{ steps.versi.outputs.nilai }}" `
            "/DNamaApl=eBisnis Inventory dan Sales" `
            "/DPenerbit=eBisnis.id" `
            "/DSitus=https://inventory.ebisnis.id" `
            "/DAppIdPemasang={{A7C84E12-7B8D-44C7-92B8-7E5D28B69A16}" `
            "/DNamaBerkasKeluaran=ebisnis-inventory-sales" `
            "/DSumber=$PWD\${{ env.JALUR }}\build\windows\x64\runner\Release" `
            "/DKeluaran=$PWD\keluaran" `
            "${{ env.JALUR }}\windows\pemasang.iss"
      - name: Tandatangani dan verifikasi installer
        id: signing
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
        run: |
          $isRelease = '${{ github.event_name }}' -eq 'push'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            if ($isRelease) {
              throw 'Sertifikat Authenticode produksi belum lengkap. Tag tidak boleh menerbitkan installer unsigned.'
            }
            Write-Warning 'Sertifikat Authenticode belum tersedia; kandidat UAT tetap dibangun tetapi tidak diterbitkan.'
            "mode=unsigned" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'ebisnis-inventory-signing.pfx'
          try {
            $normalized = $env:WINDOWS_PFX_BASE64 -replace '\s', ''
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($normalized))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -Recurse | Where-Object FullName -Match '\\x64\\' | `
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe x64 tidak ditemukan.' }
            $installer = Get-ChildItem keluaran\ebisnis-inventory-sales-*-windows.exe -File
            if ($installer.Count -ne 1) { throw "Diharapkan satu installer, ditemukan $($installer.Count)." }
            & $signtool.FullName sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_PFX_PASSWORD `
              $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool gagal dengan exit code $LASTEXITCODE." }
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Verifikasi Authenticode gagal: $($signature.Status)."
            }
            "mode=signed" >> $env:GITHUB_OUTPUT
          } finally {
            if (Test-Path $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-windows
          path: keluaran/ebisnis-inventory-sales-*-windows.exe
          if-no-files-found: error

  android-uat:
    name: UAT emulator Android Inventory
    needs: uji
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Ambil dependensi
        working-directory: ${{ env.JALUR }}
        run: flutter pub get
      - name: Jalankan UAT pada Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            cd apps/pos-flutter &&
            flutter test integration_test/inventory_android_uat_test.dart
            -d emulator-5554
            --flavor inventory
            --dart-define=APP_PRODUCT=inventory

  android:
    name: Bangun APK Android Inventory
    needs: [uji, android-uat]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Tentukan versi
        id: versi
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            nilai="${GITHUB_REF_NAME#inventory-v}"
          else
            nilai="${{ github.event.inputs.versi }}"
          fi
          echo "nilai=$nilai" >> "$GITHUB_OUTPUT"
      - name: Siapkan kunci release
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          fallback() {
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::Kunci release Android tidak dapat dipakai. Tag produksi tidak boleh menerbitkan APK debug."
              exit 1
            fi
            echo "::warning::Kunci release tidak dapat dipakai; kandidat UAT dibangun dengan signing debug dan tidak diterbitkan."
            rm -f "${JALUR}/android/key.properties" "${JALUR}/android/rilis.jks" \
              "${RUNNER_TEMP}/inventory-keystore.base64" "${RUNNER_TEMP}/inventory-key-probe.p12"
            echo "mode=fresh-install" >> "$GITHUB_OUTPUT"
            exit 0
          }
          test -n "$KEYSTORE" || fallback
          test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || {
            echo "::warning::Konfigurasi signing Android belum lengkap."; fallback;
          }
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD" | sed 's/\r$//; s/^"//; s/"$//')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | sed 's/\r$//; s/^"//; s/"$//')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | sed 's/\r$//; s/^"//; s/"$//')"
          # Secret yang disalin dari PowerShell/portal kadang terbungkus kutip,
          # BOM, spasi, atau awalan data URI. Normalisasi semuanya tanpa pernah
          # mencetak isi private key ke log Actions.
          normalized="${RUNNER_TEMP}/inventory-keystore.base64"
          printf '%s' "$KEYSTORE" \
            | sed $'s/^\xEF\xBB\xBF//; s/^"//; s/"$//; s#^data:application/[^;]*;base64,##' \
            | tr -d '\r\n\t ' > "$normalized"
          if ! base64 -d "$normalized" > "${JALUR}/android/rilis.jks"; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 tidak dapat didekode setelah normalisasi."
            fallback
          fi
          rm -f "$normalized"
          configured_store_password="$STORE_PASSWORD"
          decoded_store_password="$(printf '%s' "$STORE_PASSWORD" | base64 -d 2>/dev/null || true)"
          actual_store_password=''
          for candidate in "$configured_store_password" "$KEY_PASSWORD" "$decoded_store_password" android changeit; do
            test -n "$candidate" || continue
            if keytool -list -keystore "${JALUR}/android/rilis.jks" \
              -storepass "$candidate" >/dev/null 2>&1; then
              actual_store_password="$candidate"
              break
            fi
          done
          if [ -z "$actual_store_password" ]; then
            echo "::warning::Store password Android tidak cocok dengan keystore."
            fallback
          fi
          STORE_PASSWORD="$actual_store_password"
          if ! keytool -list -keystore "${JALUR}/android/rilis.jks" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            detected_alias="$(keytool -list -keystore "${JALUR}/android/rilis.jks" \
              -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}')"
            test -n "$detected_alias" || {
              echo "::warning::Keystore tidak memiliki PrivateKeyEntry yang dapat dipakai."; fallback;
            }
            echo "::warning::ANDROID_KEY_ALIAS tidak cocok; memakai alias PrivateKeyEntry dari keystore."
            KEY_ALIAS="$detected_alias"
          fi
          # Pastikan password private key benar tanpa mengubah keystore sumber.
          # Import sementara hanya dipakai sebagai probe dan selalu dihapus.
          probe="${RUNNER_TEMP}/inventory-key-probe.p12"
          actual_key_password=''
          decoded_key_password="$(printf '%s' "$KEY_PASSWORD" | base64 -d 2>/dev/null || true)"
          for candidate in "$KEY_PASSWORD" "$STORE_PASSWORD" "$decoded_key_password" android changeit; do
            test -n "$candidate" || continue
            rm -f "$probe"
            if keytool -importkeystore -noprompt \
              -srckeystore "${JALUR}/android/rilis.jks" -srcstorepass "$STORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" -srckeypass "$candidate" \
              -destkeystore "$probe" -deststoretype PKCS12 \
              -deststorepass inventory-probe-only -destkeypass inventory-probe-only \
              >/dev/null 2>&1; then
              actual_key_password="$candidate"
              break
            fi
          done
          rm -f "$probe"
          if [ -z "$actual_key_password" ]; then
            echo "::warning::Key password Android tidak cocok dengan private key."
            fallback
          fi
          KEY_PASSWORD="$actual_key_password"
          {
            echo "storeFile=rilis.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
          } > "${JALUR}/android/key.properties"
          echo "mode=release" >> "$GITHUB_OUTPUT"
      - name: Bangun APK
        working-directory: ${{ env.JALUR }}
        run: |
          flutter pub get
          flutter build apk --release --flavor inventory --target=lib/main_inventory.dart \
            --dart-define=VERSI=${{ steps.versi.outputs.nilai }} \
            --dart-define=APP_PRODUCT=inventory \
            --build-name=${{ steps.versi.outputs.nilai }} \
            --build-number=${{ github.run_number }}
          mkdir -p "${GITHUB_WORKSPACE}/keluaran"
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            nama="ebisnis-inventory-sales-${{ steps.versi.outputs.nilai }}.apk"
          else
            nama="ebisnis-inventory-sales-${{ steps.versi.outputs.nilai }}-fresh-install.apk"
          fi
          cp build/app/outputs/flutter-apk/app-inventory-release.apk \
            "${GITHUB_WORKSPACE}/keluaran/${nama}"
      - name: Hapus kunci dari runner
        if: always()
        run: rm -f "${JALUR}/android/key.properties" "${JALUR}/android/rilis.jks" "${RUNNER_TEMP}/inventory-keystore.base64" "${RUNNER_TEMP}/inventory-key-probe.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-android
          path: keluaran/ebisnis-inventory-sales-*.apk
          if-no-files-found: error

  terbitkan:
    name: Terbitkan GitHub Release Inventory
    needs: [windows, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: berkas
      - name: Terbitkan dua aset Inventory
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ needs.android.outputs.signing_mode }}
          WINDOWS_SIGNING_MODE: ${{ needs.windows.outputs.signing_mode }}
        run: |
          versi="${GITHUB_REF_NAME#inventory-v}"
          test "$SIGNING_MODE" = "release" || {
            echo "::error::APK bukan release-signed; publikasi dibatalkan."; exit 1;
          }
          test "$WINDOWS_SIGNING_MODE" = "signed" || {
            echo "::error::Installer Windows belum ditandatangani; publikasi dibatalkan."; exit 1;
          }
          catatan="APK dan installer Windows telah ditandatangani serta diverifikasi oleh workflow rilis."
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "eBisnis Inventory Sales $versi" \
            --notes "Perbaikan kontrol Sales Order, draft lokal, sinkronisasi, riwayat order, dan pembatalan order aman. $catatan" \
            berkas/inventory-windows/*.exe \
            berkas/inventory-android/*.apk
