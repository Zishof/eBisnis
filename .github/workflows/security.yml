name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Setiap Senin 02:00 UTC — menangkap advisory dependency yang baru terbit.
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Riwayat penuh agar seluruh commit dipindai, bukan HEAD saja.
          fetch-depth: 0

      - name: Pasang gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Pindai seluruh riwayat
        # Memakai binary langsung, bukan action, karena action menghitung rentang
        # commit dari event push. Pada push pertama rentang itu memuat induk dari
        # root commit yang tidak ada, sehingga git gagal dan job merah walau tidak
        # ada kebocoran. `detect --source .` memindai seluruh riwayat tanpa rentang.
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit produksi — critical menggagalkan build
        # Gerbang yang ditegakkan saat ini adalah `critical` pada dependency
        # produksi. Temuan `high` yang masih terbuka terdaftar pada
        # docs/development/security-debt.md beserta rencana penyelesaiannya.
        # Ambang ini TIDAK boleh diturunkan lebih jauh.
        run: pnpm audit --prod --audit-level critical

      - name: Laporan high dan moderate
        if: always()
        run: |
          {
            echo "## Audit dependency"
            echo
            echo "### Dependency produksi"
            echo '```'
            pnpm audit --prod 2>&1 | tail -3 || true
            echo '```'
            echo
            echo "### Seluruh dependency termasuk dev"
            echo '```'
            pnpm audit 2>&1 | tail -3 || true
            echo '```'
            echo
            echo "Temuan high yang sudah diketahui dan diterima sementara:"
            echo "docs/development/security-debt.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Daftar lisensi dependency
        if: always()
        continue-on-error: true
        run: pnpm licenses list --prod || true
