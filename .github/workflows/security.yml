name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Setiap Senin 02:00 UTC — menangkap kerentanan dependency yang baru terbit.
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Riwayat penuh agar gitleaks memindai seluruh commit, bukan HEAD saja.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit (high dan critical menggagalkan job)
        run: pnpm audit --audit-level high

      - name: Daftar lisensi dependency
        # Informasional: lisensi yang tidak kompatibel harus terlihat pada log,
        # tetapi belum menggagalkan build sampai kebijakan lisensi ditetapkan.
        continue-on-error: true
        run: pnpm licenses list --prod || true
