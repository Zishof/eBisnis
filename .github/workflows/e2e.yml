name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Alur `Lint, test, build` sengaja TIDAK menyentuh basis data sama sekali; ia
# memakai DATABASE_URL palsu supaya Prisma dapat mengurai schema. Alur ini
# berbeda: ia menjalankan basis data sungguhan, memprovision satu tenant, lalu
# menjalankan peramban terhadap keduanya.
#
# Dipisah menjadi berkas tersendiri karena waktunya jauh lebih lama, dan
# kegagalannya berbeda jenis — uji unit yang merah berarti logikanya salah,
# uji peramban yang merah bisa berarti layarnya rusak ATAU lingkungannya belum
# siap. Mencampurnya membuat kedua sinyal itu sulit dibedakan.
jobs:
  e2e:
    name: E2E peramban
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Versi 13 dipilih dengan sengaja: **produksi memakai PostgreSQL 13.12**,
        # sedangkan pengembangan memakai 17. Menjalankan CI pada versi produksi
        # membuat SQL yang hanya berjalan pada versi baru tertangkap di sini —
        # bukan pada malam peluncuran. Pelajaran ini sudah pernah diambil: satu
        # migrasi sempat memakai `NULLS NOT DISTINCT` yang menuntut PG 15.
        image: postgres:13
        env:
          POSTGRES_USER: ebisnis
          POSTGRES_PASSWORD: ebisnis
          POSTGRES_DB: ebisnis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ebisnis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://ebisnis:ebisnis@localhost:5432/ebisnis?schema=platform
      DIRECT_DATABASE_URL: postgresql://ebisnis:ebisnis@localhost:5432/ebisnis?schema=platform
      DATABASE_ADMIN_URL: postgresql://ebisnis:ebisnis@localhost:5432/ebisnis
      NODE_ENV: test
      PORT: 3000
      API_PREFIX: /api/v1
      # Rahasia CI dibangkitkan per jalan dan tidak pernah dipakai di mana pun
      # selain di sini. Tidak ada nilai produksi yang menyentuh berkas ini.
      JWT_ACCESS_SECRET: ci-access-secret-not-used-anywhere-else-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-else-9876543210
      JWT_ACCESS_TTL: 900s
      JWT_REFRESH_TTL: 7d
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: warn
      # Pembatas laju dilonggarkan HANYA di sini.
      #
      # Nilai bawaan (300 permintaan/menit, 10 login/menit) disetel untuk satu
      # alamat IP milik satu orang. Runner CI adalah satu alamat IP yang
      # menjalankan seluruh rangkaian — puluhan pemuatan halaman, masing-masing
      # membuka beberapa permintaan sekaligus — sehingga ia melewatinya dengan
      # mudah, dan yang gagal kemudian adalah uji yang sama sekali tidak
      # berhubungan dengan pembatasan laju.
      #
      # Nilai produksi TIDAK diubah; hanya lingkungan pengujian yang dilonggarkan,
      # persis sebagaimana dimaksud komentar pada `apps/api/src/config`.
      THROTTLE_DEFAULT_LIMIT: '5000'
      THROTTLE_AUTH_LIMIT: '200'
      APP_URL: http://localhost:3000
      WEB_URL: http://localhost:5173
      PLATFORM_SCHEMA: platform
      PLATFORM_AUDIT_SCHEMA: platform__audit
      DEMO_SCHEMA: demo
      DEMO_AUDIT_SCHEMA: demo__audit
      DEMO_RESET_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Migrasi control plane
        run: pnpm db:deploy

      - name: Seed control plane
        run: pnpm seed:platform

      - name: Provision dan seed tenant demo
        run: pnpm seed:tenant

      - name: Migrasi schema tenant
        run: pnpm migrate:tenants

      # Verifikasi seed dijalankan SEBELUM peramban. Uji peramban yang gagal
      # karena datanya belum lengkap akan tampak seperti layar yang rusak, dan
      # menghabiskan waktu orang yang membacanya.
      - name: Verifikasi seed
        run: pnpm seed:verify

      - name: Build
        run: pnpm build
        env:
          # Vite/Workbox harus dibangun seperti artefak produksi. Job-level
          # NODE_ENV=test tetap dipakai oleh seed, API, dan Playwright, tetapi
          # bila diwariskan ke Vite bundle utama membengkak melewati batas
          # precache 2 MiB dan E2E berhenti sebelum peramban dijalankan.
          NODE_ENV: production

      - name: Pasang peramban Playwright
        run: pnpm --filter @ebisnis/web test:e2e:install

      - name: Jalankan API
        run: |
          # `nohup` dan `disown` supaya proses bertahan setelah langkah ini
          # selesai; tanpa keduanya runner dapat menutup seluruh grup prosesnya.
          nohup node apps/api/dist/main.js > /tmp/api-e2e.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "API siap setelah ${i} detik."
              exit 0
            fi
            sleep 1
          done
          echo "API tidak siap dalam 60 detik."
          cat /tmp/api-e2e.log
          exit 1

      - name: Siapkan data uji kasir
        run: node apps/api/scripts/e2e-pos-fixture.mjs setup

      # Langkah ini MEMBLOKIR penggabungan.
      #
      # Ia sempat memakai `continue-on-error` sementara dua hal dibereskan:
      # satu cacat aksesibilitas, dan ketidakstabilan uji kasir. Keduanya sudah
      # selesai, jadi pelindungnya dilepas.
      #
      # Pelajaran dari masa itu perlu dicatat, sebab ia mudah terulang: selama
      # baris `continue-on-error` terpasang, cek berwarna hijau **sekalipun
      # ujinya gagal**. Tiga kegagalan sungguhan sempat lolos tanpa terlihat,
      # dan hanya ketahuan karena lognya dibaca, bukan warnanya. Pelindung yang
      # membuat laporan berbohong lebih berbahaya daripada rangkaian uji yang
      # merah — yang merah setidaknya jujur.
      #
      # Ketidakstabilan yang dahulu terlihat seperti "runner CI lambat" ternyata
      # cacat produk: 429 sesaat dari pembatas laju membuat `api.ts` membuang
      # refresh token, dan pengguna terlempar ke halaman masuk. Pada kasir itu
      # berarti keranjang yang sedang dilayani lenyap. Diperbaiki, dan dijaga
      # `apps/web/src/lib/api.spec.ts`.
      - name: Uji peramban
        run: pnpm test:e2e
        env:
          # Playwright menyalakan server Vite sendiri lewat `webServer` pada
          # konfigurasinya; proxy-nya diarahkan ke API yang baru dijalankan.
          API_PROXY_TARGET: http://localhost:3000

      # Pembersihan tetap dijalankan meski uji gagal. Data uji yang tertinggal
      # akan menumpuk pada jalan berikutnya dan membuat kegagalannya makin sulit
      # dibaca.
      - name: Bersihkan data uji kasir
        if: always()
        run: node apps/api/scripts/e2e-pos-fixture.mjs teardown

      - name: Unggah laporan Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            apps/web/playwright-report
            apps/web/test-results

      - name: Catatan API bila gagal
        if: failure()
        run: tail -n 200 /tmp/api-e2e.log || true
