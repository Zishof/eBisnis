name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nilai palsu, hanya agar Prisma dapat mem-parse schema saat validate/generate.
  # CI tidak pernah terhubung ke database mana pun.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=platform
  DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=platform
  DATABASE_ADMIN_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm db:validate

      - name: Prisma generate
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Unit test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Unggah artefak build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/api/dist
            apps/web/dist
