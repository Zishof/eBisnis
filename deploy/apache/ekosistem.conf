# Konfigurasi Apache untuk lima portal ekosistem.
#
# ebisnis.id · enterprise-education.id · emedik.id · ekoperasi.id · info-desa.id
#
# ---------------------------------------------------------------------------
# Mengapa SATU vhost, bukan lima
# ---------------------------------------------------------------------------
#
# Kelimanya dilayani aplikasi yang sama. Yang membedakan jawaban untuk masing-
# masing adalah baris di `platform.platform_portal_domain`, dibaca aplikasi dari
# header `Host` — bukan lima penyebaran, lima build, atau lima berkas ini.
#
# Lima vhost yang menunjuk root dan proxy yang sama hanya menghasilkan lima
# tempat yang harus diperbarui bersamaan, dan yang terlupa satu akan menyajikan
# build lama tanpa ada yang menyadarinya.
#
# ---------------------------------------------------------------------------
# Yang WAJIB dikerjakan sebelum ini dipasang
# ---------------------------------------------------------------------------
#
#   1. DNS kelima apex domain beserta `www.` dan `app.` mengarah ke server ini.
#   2. Sertifikat TLS untuk kelima domain. Sertifikat swa-tanda hanya untuk uji;
#      peramban akan memperingatkan, dan pengunjung yang diperingatkan pada
#      halaman pemasaran tidak kembali.
#   3. Baris portal sudah diseed — tanpa itu setiap host dijawab "tidak
#      ditemukan", yang memang benar: aplikasi menolak melayani host yang tidak
#      terdaftar (tanpa jalur cadangan).
#
# Modul: sudo a2enmod proxy proxy_http headers rewrite ssl deflate expires
#
# Pasang:
#   sudo cp deploy/apache/ekosistem.conf /etc/apache2/sites-available/
#   sudo a2ensite ekosistem && sudo apache2ctl configtest
#   sudo systemctl reload apache2

Define EKOSISTEM_WEB_ROOT /opt/ebisnis/app/apps/web/dist
Define EKOSISTEM_API      http://127.0.0.1:3000

# ---------------------------------------------------------------------------
# HTTP :80 — hanya mengarahkan ke HTTPS
# ---------------------------------------------------------------------------
#
# Tidak menyajikan apa pun di :80. Halaman yang dapat dibuka tanpa TLS berarti
# ada jalur tempat kode otorisasi dan cookie sesi dapat melintas terbuka, dan
# pengarahan yang dilakukan SESUDAH menyajikan sudah terlambat.
<VirtualHost *:80>
    ServerName ebisnis.id
    ServerAlias www.ebisnis.id app.ebisnis.id auth.ebisnis.id
    ServerAlias enterprise-education.id www.enterprise-education.id app.enterprise-education.id
    ServerAlias emedik.id www.emedik.id app.emedik.id
    ServerAlias ekoperasi.id www.ekoperasi.id app.ekoperasi.id
    ServerAlias info-desa.id www.info-desa.id app.info-desa.id

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{HTTP_HOST}/$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/ekosistem-error.log
    CustomLog ${APACHE_LOG_DIR}/ekosistem-access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# HTTPS :443 — seluruh portal
# ---------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName ebisnis.id
    ServerAlias www.ebisnis.id app.ebisnis.id auth.ebisnis.id
    ServerAlias enterprise-education.id www.enterprise-education.id app.enterprise-education.id
    ServerAlias emedik.id www.emedik.id app.emedik.id
    ServerAlias ekoperasi.id www.ekoperasi.id app.ekoperasi.id
    ServerAlias info-desa.id www.info-desa.id app.info-desa.id

    ServerAdmin webmaster@ebisnis.id
    DocumentRoot ${EKOSISTEM_WEB_ROOT}

    SSLEngine on
    # Ganti dengan sertifikat tepercaya untuk kelima domain. Satu sertifikat SAN
    # yang memuat kelimanya lebih mudah diperbarui daripada lima sertifikat yang
    # kedaluwarsa pada tanggal berbeda.
    SSLCertificateFile    /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key

    # Header Host diteruskan apa adanya ke aplikasi. Itulah satu-satunya cara
    # aplikasi mengetahui portal mana yang diminta; menormalkannya di sini
    # membuat kelima portal tampak sama bagi aplikasi.
    ProxyPreserveHost On

    Include /etc/apache2/conf-available/ebisnis-app.inc

    ErrorLog  ${APACHE_LOG_DIR}/ekosistem-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ekosistem-ssl-access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# Situs penyewa (mitrasehat.emedik.id, sukoanyar.info-desa.id, …)
# ---------------------------------------------------------------------------
#
# TIDAK dicantumkan di sini. Wildcard `*.emedik.id` pada Apache akan melayani
# host apa pun di bawahnya, termasuk yang belum terdaftar — sedangkan aplikasi
# menolak host yang tidak terdaftar. Hasilnya adalah Apache yang menjawab untuk
# host yang aplikasinya sendiri tolak: sertifikat yang cocok, halaman yang
# kosong, dan tidak ada yang tahu di lapisan mana masalahnya.
#
# Situs penyewa ditambahkan setelah domainnya terverifikasi, dengan sertifikat
# wildcard yang memang disiapkan untuk itu.
