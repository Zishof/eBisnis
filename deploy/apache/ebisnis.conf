# Konfigurasi Apache untuk portal ekosistem — aplikasi Node/React.
#
#   ebisnis.id · enterprise-education.id · santri.info · emedik.id
#   ekoperasi.id · info-desa.id
#
# `santri.info` berbeda dari yang lain: selain apex, ia melayani `*.santri.info`
# karena setiap pondok pesantren yang mendaftar memperoleh subdomainnya sendiri.
# Akibatnya sertifikatnya menuntut tantangan DNS-01, bukan HTTP-01 — lihat
# docs/deployment/santri-info.md.
#
# ---------------------------------------------------------------------------
# Mengapa kelimanya di SATU berkas dan SATU VirtualHost
# ---------------------------------------------------------------------------
#
# Kelimanya dilayani aplikasi yang sama. Yang membedakan jawaban untuk masing-
# masing adalah baris di `platform.platform_portal_domain`, dibaca aplikasi dari
# header `Host` — bukan lima penyebaran, lima build, atau lima berkas ini.
#
# `ebisnis-app.inc` tidak menyebut satu pun nama domain; ia bekerja untuk host
# mana pun yang sampai kepadanya. Karena itu menambah portal cukup menambah
# `ServerAlias`, bukan menyalin seluruh blok.
#
# Dua berkas vhost yang mengklaim ServerName sama lebih buruk lagi: Apache
# memakai yang pertama ditemukan, dan yang kedua diam tanpa keluhan.
#
# PERUBAHAN PENTING dari konfigurasi lama:
#
#   1. Redirect "/" -> "/ebisnis/" DIHAPUS. Aplikasi baru disajikan pada root,
#      tidak memakai context path. Redirect lama akan menghasilkan 404.
#   2. Apache menyajikan hasil build React secara langsung sebagai berkas statis,
#      dan hanya mem-proxy "/api", "/health", serta "/docs" ke NestJS.
#      Aplikasi Node TIDAK menyajikan berkas statis.
#   3. FallbackResource membuat seluruh route React (/harga, /daftar, /masuk,
#      /app/..., /platform/...) dilayani index.html, sehingga akses langsung ke
#      URL tersebut dan tombol "Daftar" berfungsi tanpa konfigurasi tambahan.
#   4. Domain portal lain ditambahkan pada ServerAlias, termasuk wildcard
#      `*.santri.info` untuk situs tiap pondok pesantren.
#
# Modul yang diperlukan:
#   sudo a2enmod proxy proxy_http headers rewrite ssl deflate expires
#
# Letakkan berkas ini pada /etc/apache2/sites-available/ebisnis.conf
# lalu: sudo a2ensite ebisnis && sudo apache2ctl configtest && sudo systemctl reload apache2

# Lokasi hasil build React. Diperbarui oleh deploy/update.sh.
Define EBISNIS_WEB_ROOT /opt/ebisnis/app/apps/web/dist
Define EBISNIS_API      http://127.0.0.1:3000

# ---------------------------------------------------------------------------
# HTTP :80
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName ebisnis.id
    UseCanonicalName Off
    ServerAlias www.ebisnis.id app.ebisnis.id auth.ebisnis.id
    ServerAlias demo.ebisnis.id salon.ebisnis.id demo-inventory.ebisnis.id *-inventory.ebisnis.id *.inventory.ebisnis.id
    ServerAlias dev.ebisnis.id belanja.ebisnis.id koperasi.ebisnis.id
    ServerAlias enterprise-education.id www.enterprise-education.id app.enterprise-education.id
    ServerAlias emedik.id www.emedik.id app.emedik.id apotik.emedik.id demo-apotik.emedik.id *.emedik.id
    ServerAlias ekoperasi.id www.ekoperasi.id app.ekoperasi.id
    ServerAlias info-desa.id www.info-desa.id app.info-desa.id
    # santri.info — portal ePesantren. Wildcard-nya WAJIB: setiap pondok yang
    # mendaftar memperoleh `<pondok>.santri.info`, dan menambahkannya satu per
    # satu berarti setiap pendaftaran menunggu seseorang menyunting berkas ini.
    ServerAlias santri.info www.santri.info app.santri.info *.santri.info
    ServerAdmin webmaster@ebisnis.id

    ErrorLog  ${APACHE_LOG_DIR}/ebisnis-error.log
    CustomLog ${APACHE_LOG_DIR}/ebisnis-access.log combined

    # Aktifkan blok ini SETELAH memasang sertifikat tepercaya (Let's Encrypt).
    # Selama masih memakai sertifikat self-signed, biarkan nonaktif supaya
    # pengujian lewat HTTP tidak terhalang peringatan browser.
    #
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    Include /etc/apache2/conf-available/ebisnis-app.inc
</VirtualHost>

# ---------------------------------------------------------------------------
# HTTPS :443
# ---------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName ebisnis.id
    UseCanonicalName Off
    ServerAlias www.ebisnis.id app.ebisnis.id auth.ebisnis.id
    ServerAlias demo.ebisnis.id salon.ebisnis.id demo-inventory.ebisnis.id *-inventory.ebisnis.id *.inventory.ebisnis.id
    ServerAlias dev.ebisnis.id belanja.ebisnis.id koperasi.ebisnis.id
    ServerAlias enterprise-education.id www.enterprise-education.id app.enterprise-education.id
    ServerAlias emedik.id www.emedik.id app.emedik.id apotik.emedik.id demo-apotik.emedik.id *.emedik.id
    ServerAlias ekoperasi.id www.ekoperasi.id app.ekoperasi.id
    ServerAlias info-desa.id www.info-desa.id app.info-desa.id
    # santri.info — portal ePesantren. Wildcard-nya WAJIB: setiap pondok yang
    # mendaftar memperoleh `<pondok>.santri.info`, dan menambahkannya satu per
    # satu berarti setiap pendaftaran menunggu seseorang menyunting berkas ini.
    ServerAlias santri.info www.santri.info app.santri.info *.santri.info
    ServerAdmin webmaster@ebisnis.id

    ErrorLog  ${APACHE_LOG_DIR}/ebisnis-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ebisnis-ssl-access.log combined

    SSLEngine on
    # Sertifikat swa-tanda hanya untuk uji. Untuk lima domain, SATU sertifikat
    # SAN yang memuat kelimanya lebih mudah diperbarui daripada lima sertifikat
    # yang kedaluwarsa pada tanggal berbeda — dan yang kedaluwarsa diam-diam
    # adalah yang paling lama tidak ketahuan.
    SSLCertificateFile    /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key

    # Beri tahu aplikasi bahwa permintaan asalnya HTTPS.
    RequestHeader set X-Forwarded-Proto "https"

    Include /etc/apache2/conf-available/ebisnis-app.inc
</VirtualHost>

# ---------------------------------------------------------------------------
# Situs penyewa (mitrasehat.emedik.id, sukoanyar.info-desa.id, …)
# ---------------------------------------------------------------------------
#
# Sebagian subdomain eMedik sengaja dicantumkan sebagai wildcard karena landing
# apotik memakai pola `{tenant}-apotik.emedik.id`, dan aplikasi menentukan
# tampilannya dari header Host. Untuk custom domain non-eMedik, tetap tambahkan
# hostnya setelah domain penyewa terverifikasi.
#
# Tambahkan hostnya ke ServerAlias setelah domain penyewa terverifikasi.

# ---------------------------------------------------------------------------
# VirtualHost legacy pada :3449 — sistem Java lama, DIPERTAHANKAN.
#
# Sebelumnya port 80/443 mengarah ke aplikasi Java pada 38.47.178.42:3009
# dengan context /ebisnis/. Sejak konfigurasi ini, port 80/443 melayani
# aplikasi baru, dan sistem lama hanya dapat diakses lewat :3449.
#
# Hapus kedua blok di bawah bila sistem lama sudah tidak dipakai.
# ---------------------------------------------------------------------------
<VirtualHost *:3449>
    ServerName 38.47.178.34
    ServerAlias ebisnis.id
    ServerAdmin webmaster@ecampus.id
    ErrorLog ${APACHE_LOG_DIR}/error.log

    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # Sebelumnya memakai ajp://localhost:3009/. Diubah menjadi HTTP agar tidak
    # bergantung pada modul proxy_ajp dan connector AJP Tomcat.
    #
    # Port 3030, bukan 3009: pada instance Tomcat ini 3009 adalah connector AJP
    # dan 3030 connector HTTP. Keduanya milik proses yang sama — terlihat dari
    #     sudo ss -ltnp | grep java
    # yang menampilkan 3030, 3009, dan 3005 (shutdown) pada satu pid.
    # Menunjuk 3009 lewat HTTP menghasilkan 502 karena port itu tidak bicara
    # HTTP.
    ProxyPass        / http://localhost:3030/
    ProxyPassReverse / http://localhost:3030/

    <Location />
        Require all granted
    </Location>

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key
</VirtualHost>

<VirtualHost *:3449>
    ServerName web.ebisnis.id
    ServerAdmin webmaster@ebisnis.id
    ErrorLog ${APACHE_LOG_DIR}/error.log

    # Direktori lama /opt/website/ebisnis tidak selalu ada pada server baru.
    # Pakai build React yang sama agar configtest tidak memperingatkan
    # DocumentRoot kosong dan web.ebisnis.id tetap menampilkan aplikasi.
    DocumentRoot ${EBISNIS_WEB_ROOT}

    <Directory ${EBISNIS_WEB_ROOT}/>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    <Location />
        Require all granted
    </Location>

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key
</VirtualHost>
