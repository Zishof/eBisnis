# Konfigurasi Apache untuk eBisnis.id — aplikasi Node/React.
#
# PERUBAHAN PENTING dari konfigurasi lama:
#
#   1. Redirect "/" -> "/ebisnis/" DIHAPUS. Aplikasi baru disajikan pada root,
#      tidak memakai context path. Redirect lama akan menghasilkan 404.
#   2. Apache menyajikan hasil build React secara langsung sebagai berkas statis,
#      dan hanya mem-proxy "/api", "/health", serta "/docs" ke NestJS.
#      Aplikasi Node TIDAK menyajikan berkas statis.
#   3. FallbackResource membuat seluruh route React (/harga, /daftar, /masuk,
#      /app/..., /platform/...) dilayani index.html, sehingga akses langsung ke
#      URL tersebut dan tombol "Daftar" berfungsi tanpa konfigurasi tambahan.
#
# Modul yang diperlukan:
#   sudo a2enmod proxy proxy_http headers rewrite ssl deflate expires
#
# Letakkan berkas ini pada /etc/apache2/sites-available/ebisnis.conf
# lalu: sudo a2ensite ebisnis && sudo apache2ctl configtest && sudo systemctl reload apache2

# Lokasi hasil build React. Diperbarui oleh deploy/update.sh.
Define EBISNIS_WEB_ROOT /opt/ebisnis/app/apps/web/dist
Define EBISNIS_API      http://127.0.0.1:3000

# ---------------------------------------------------------------------------
# HTTP :80
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName ebisnis.id
    ServerAlias www.ebisnis.id demo.ebisnis.id dev.ebisnis.id
    ServerAdmin webmaster@ebisnis.id

    ErrorLog  ${APACHE_LOG_DIR}/ebisnis-error.log
    CustomLog ${APACHE_LOG_DIR}/ebisnis-access.log combined

    # Aktifkan blok ini SETELAH memasang sertifikat tepercaya (Let's Encrypt).
    # Selama masih memakai sertifikat self-signed, biarkan nonaktif supaya
    # pengujian lewat HTTP tidak terhalang peringatan browser.
    #
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    Include /etc/apache2/conf-available/ebisnis-app.inc
</VirtualHost>

# ---------------------------------------------------------------------------
# HTTPS :443
# ---------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName ebisnis.id
    ServerAlias www.ebisnis.id demo.ebisnis.id dev.ebisnis.id
    ServerAdmin webmaster@ebisnis.id

    ErrorLog  ${APACHE_LOG_DIR}/ebisnis-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ebisnis-ssl-access.log combined

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key

    # Beri tahu aplikasi bahwa permintaan asalnya HTTPS.
    RequestHeader set X-Forwarded-Proto "https"

    Include /etc/apache2/conf-available/ebisnis-app.inc
</VirtualHost>

# ---------------------------------------------------------------------------
# VirtualHost legacy pada :3449 — sistem Java lama, DIPERTAHANKAN.
#
# Sebelumnya port 80/443 mengarah ke aplikasi Java pada 38.47.178.42:3009
# dengan context /ebisnis/. Sejak konfigurasi ini, port 80/443 melayani
# aplikasi baru, dan sistem lama hanya dapat diakses lewat :3449.
#
# Hapus kedua blok di bawah bila sistem lama sudah tidak dipakai.
# ---------------------------------------------------------------------------
<VirtualHost *:3449>
    ServerName 38.47.178.34
    ServerAlias ebisnis.id
    ServerAdmin webmaster@ecampus.id
    ErrorLog ${APACHE_LOG_DIR}/error.log

    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # Sebelumnya memakai ajp://localhost:3009/. Diubah menjadi HTTP agar tidak
    # bergantung pada modul proxy_ajp dan connector AJP Tomcat.
    #
    # Port 3030, bukan 3009: pada instance Tomcat ini 3009 adalah connector AJP
    # dan 3030 connector HTTP. Keduanya milik proses yang sama — terlihat dari
    #     sudo ss -ltnp | grep java
    # yang menampilkan 3030, 3009, dan 3005 (shutdown) pada satu pid.
    # Menunjuk 3009 lewat HTTP menghasilkan 502 karena port itu tidak bicara
    # HTTP.
    ProxyPass        / http://localhost:3030/
    ProxyPassReverse / http://localhost:3030/

    <Location />
        Require all granted
    </Location>

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key
</VirtualHost>

<VirtualHost *:3449>
    ServerName web.ebisnis.id
    ServerAdmin webmaster@ebisnis.id
    ErrorLog ${APACHE_LOG_DIR}/error.log

    DocumentRoot /opt/website/ebisnis

    <Directory /opt/website/ebisnis/>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Location />
        Require all granted
    </Location>

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key
</VirtualHost>
